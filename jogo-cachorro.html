<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salto do Cachorro</title>
  <style>
    :root {
      color-scheme: light;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #bfe7ff 0%, #f4fbff 60%, #daf0c4 60%, #b3e37d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2b2b2b;
    }

    .game-wrapper {
      width: min(90vw, 900px);
      background: rgba(255, 255, 255, 0.92);
      border-radius: 20px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.15);
      padding: 24px;
      display: grid;
      gap: 16px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    header h1 {
      font-size: clamp(1.4rem, 2vw, 2rem);
      margin: 0;
    }

    .scoreboard {
      display: flex;
      gap: 16px;
      font-weight: 600;
    }

    canvas {
      width: 100%;
      background: linear-gradient(180deg, #fefefe 0%, #fefefe 60%, #e7d7b5 60%, #d1b186 100%);
      border-radius: 16px;
      border: 2px solid #d8d8d8;
    }

    .instructions {
      display: grid;
      gap: 6px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .instructions span {
      font-weight: 600;
    }

    .status {
      padding: 12px 14px;
      border-radius: 12px;
      background: #fff2cc;
      color: #7a5200;
      font-weight: 600;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 600;
      background: #3d7af2;
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(61, 122, 242, 0.3);
    }

    button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <header>
      <h1>Salto do Cachorro</h1>
      <div class="scoreboard">
        <div>Fase: <span id="level">1</span></div>
        <div>Pontos: <span id="score">0</span>/10</div>
        <div>Recorde: <span id="best">0</span></div>
      </div>
    </header>

    <canvas id="game" width="860" height="360" aria-label="Área do jogo"></canvas>

    <div class="status" id="status">Pressione espaço ou seta para cima para começar a jogar.</div>

    <div class="controls">
      <button id="restart">Reiniciar</button>
    </div>

    <div class="instructions">
      <div><span>Objetivo:</span> Pule as bolas quicando sem ser atingido.</div>
      <div><span>Fases:</span> Ao chegar em 10 pontos, avança e a velocidade aumenta.</div>
      <div><span>Dica:</span> Mantenha o ritmo das bolas para acertar o tempo do salto.</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const levelEl = document.getElementById("level");
    const bestEl = document.getElementById("best");
    const statusEl = document.getElementById("status");
    const restartBtn = document.getElementById("restart");

    const groundY = 280;
    const dog = {
      x: 120,
      y: groundY,
      width: 60,
      height: 50,
      velocityY: 0,
      isJumping: false,
    };

    const gameState = {
      running: false,
      score: 0,
      level: 1,
      best: 0,
      speed: 4,
      spawnGap: 220,
      gravity: 0.7,
      jumpForce: -12,
      lastSpawnX: 0,
    };

    let balls = [];

    const drawDog = () => {
      ctx.fillStyle = "#d9905e";
      ctx.fillRect(dog.x, dog.y - dog.height, dog.width, dog.height);
      ctx.fillStyle = "#54321a";
      ctx.fillRect(dog.x + 40, dog.y - dog.height - 12, 20, 12);
      ctx.fillStyle = "#2b2b2b";
      ctx.beginPath();
      ctx.arc(dog.x + 45, dog.y - dog.height - 8, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#d9905e";
      ctx.beginPath();
      ctx.moveTo(dog.x + 10, dog.y - dog.height);
      ctx.lineTo(dog.x + 28, dog.y - dog.height - 18);
      ctx.lineTo(dog.x + 34, dog.y - dog.height - 5);
      ctx.closePath();
      ctx.fill();
    };

    const drawGround = () => {
      ctx.strokeStyle = "#7f643c";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, groundY + 2);
      ctx.lineTo(canvas.width, groundY + 2);
      ctx.stroke();
    };

    const drawBall = (ball) => {
      ctx.fillStyle = "#4fc3f7";
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(ball.x - 6, ball.y - 4, ball.radius / 3, 0, Math.PI * 2);
      ctx.fill();
    };

    const spawnBall = () => {
      const bounceHeight = 80 + Math.random() * 50;
      const radius = 16 + Math.random() * 4;
      balls.push({
        x: canvas.width + radius,
        y: groundY - radius,
        radius,
        bounceHeight,
        phase: Math.random() * Math.PI,
      });
      gameState.lastSpawnX = canvas.width + radius;
    };

    const updateDog = () => {
      dog.y += dog.velocityY;
      dog.velocityY += gameState.gravity;
      if (dog.y >= groundY) {
        dog.y = groundY;
        dog.velocityY = 0;
        dog.isJumping = false;
      }
    };

    const updateBalls = () => {
      balls.forEach((ball) => {
        ball.x -= gameState.speed;
        ball.phase += 0.12 + gameState.level * 0.01;
        ball.y = groundY - ball.radius - Math.abs(Math.sin(ball.phase)) * ball.bounceHeight;
      });
      balls = balls.filter((ball) => ball.x > -ball.radius);
    };

    const detectCollision = () => {
      return balls.some((ball) => {
        const dogLeft = dog.x;
        const dogRight = dog.x + dog.width;
        const dogTop = dog.y - dog.height;
        const dogBottom = dog.y;
        const closestX = Math.max(dogLeft, Math.min(ball.x, dogRight));
        const closestY = Math.max(dogTop, Math.min(ball.y, dogBottom));
        const dx = ball.x - closestX;
        const dy = ball.y - closestY;
        return dx * dx + dy * dy < ball.radius * ball.radius;
      });
    };

    const updateScore = () => {
      balls.forEach((ball) => {
        if (!ball.passed && ball.x + ball.radius < dog.x) {
          ball.passed = true;
          gameState.score += 1;
          if (gameState.score > gameState.best) {
            gameState.best = gameState.score;
          }
          if (gameState.score >= 10) {
            gameState.level += 1;
            gameState.score = 0;
            gameState.speed += 0.8;
            gameState.spawnGap = Math.max(140, gameState.spawnGap - 20);
            statusEl.textContent = `Parabéns! Fase ${gameState.level}. As bolas estão mais rápidas.`;
          }
        }
      });
      scoreEl.textContent = gameState.score;
      levelEl.textContent = gameState.level;
      bestEl.textContent = gameState.best;
    };

    const resetGame = () => {
      gameState.running = false;
      gameState.score = 0;
      gameState.level = 1;
      gameState.speed = 4;
      gameState.spawnGap = 220;
      balls = [];
      dog.y = groundY;
      dog.velocityY = 0;
      dog.isJumping = false;
      statusEl.textContent = "Pressione espaço ou seta para cima para começar a jogar.";
      scoreEl.textContent = gameState.score;
      levelEl.textContent = gameState.level;
    };

    const startGame = () => {
      if (!gameState.running) {
        gameState.running = true;
        statusEl.textContent = "Desvie das bolas!";
      }
    };

    const gameLoop = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGround();

      if (gameState.running) {
        updateDog();
        updateBalls();

        if (balls.length === 0 || canvas.width - gameState.lastSpawnX >= gameState.spawnGap) {
          spawnBall();
        }

        if (detectCollision()) {
          statusEl.textContent = "Você foi atingido! O jogo recomeçou.";
          resetGame();
        }

        updateScore();
      }

      drawDog();
      balls.forEach(drawBall);
      requestAnimationFrame(gameLoop);
    };

    const jump = () => {
      if (!dog.isJumping) {
        dog.velocityY = gameState.jumpForce;
        dog.isJumping = true;
        startGame();
      }
    };

    document.addEventListener("keydown", (event) => {
      if (event.code === "Space" || event.code === "ArrowUp") {
        event.preventDefault();
        jump();
      }
    });

    canvas.addEventListener("pointerdown", () => {
      jump();
    });

    restartBtn.addEventListener("click", () => {
      resetGame();
    });

    gameLoop();
  </script>
</body>
</html>
